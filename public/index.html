<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <div class="app-shell">
        <div class="converter-card">
            <div class="hero">
                <p class="eyebrow">Instant currency conversion</p>
                <h1>Turn your money into any currency in seconds.</h1>
                <p>
                    Enter an amount, choose your currencies and get an instant result with live exchange rates.
                </p>
            </div>

            <form id="converter-form" class="converter-form">
                <label class="field">
                    <span>Amount</span>
                    <input id="amount" type="number" min="0" step="0.01" value="100" required />
                </label>

                <div class="currency-row">
                    <label class="field">
                        <span>From</span>
                        <select id="fromCurrency">
                            <!-- <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="INR">INR - Indian Rupee</option>
                            <option value="JPY">JPY - Japanese Yen</option>
                            <option value="CAD">CAD - Canadian Dollar</option>
                            <option value="AUD">AUD - Australian Dollar</option> -->
                        </select>
                    </label>

                    <button id="swap-btn" class="swap-btn" type="button" aria-label="Swap currencies">
                        ⇄
                    </button>

                    <label class="field">
                        <span>To</span>
                        <select id="toCurrency">
                            <option value="EUR">EUR - Euro</option>
                            <option value="USD">USD - US Dollar</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="INR">INR - Indian Rupee</option>
                            <option value="JPY">JPY - Japanese Yen</option>
                            <option value="CAD">CAD - Canadian Dollar</option>
                            <option value="AUD">AUD - Australian Dollar</option>
                        </select>
                    </label>
                </div>

                <button type="submit" class="convert-btn">Convert now</button>
            </form>

            <div id="status" class="status" role="status">
                Enter an amount and pick your currencies.
            </div>

            <div id="result-card" class="result-card hidden">
                <p class="result-label">Converted amount</p>
                <h2 id="result-value">0.00</h2>
                <div class="result-stats">
                    <div>
                        <span>Exchange rate</span>
                        <strong id="rate-value">1.00</strong>
                    </div>
                    <div>
                        <span>Target currency</span>
                        <strong id="target-currency">USD</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
